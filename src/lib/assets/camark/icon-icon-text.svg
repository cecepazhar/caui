<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#0A0A0C" stroke="#06B6D4" stroke-width="4" stroke-opacity="0.3"/>
  <!-- Scaled Symbol with Glow -->
  <g transform="translate(256, 190) scale(0.68) translate(-256, -256)">
    <circle cx="256" cy="256" r="210" fill="url(#glow)"/>
    <g fill="none">
      <!-- Document Badge / Markdown Frame Container -->
      <rect x="76" y="128" width="360" height="256" rx="36" fill="#111827" fill-opacity="0.6" stroke="url(#symbolGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Bold 'M' Glyph -->
      <path d="M128 320 V192 L188 252 L248 192 V320"
            stroke="url(#symbolGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Downward Chevron (no stem) -->
      <path d="M296 272 L344 320 L392 272"
            stroke="url(#whiteGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- Typography -->
  <text x="256" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CAMark</text>
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.2">Markdown &amp; Technical Documentation Studio</text>
</svg>