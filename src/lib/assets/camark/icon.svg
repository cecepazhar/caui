<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#0A0A0C" stroke="#06B6D4" stroke-width="4" stroke-opacity="0.35"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Main Markdown Symbol (Badge + M + Arrow) -->
  <!-- Outer Badge Container -->
  <rect x="76" y="128" width="360" height="256" rx="36" fill="#111827" fill-opacity="0.6" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bold 'M' (Markdown Glyph) -->
  <path d="M128 320 V192 L188 252 L248 192 V320" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Downward Arrow (Download/Format/Markdown standard) -->
  <path d="M344 192 V316" 
        fill="none" stroke="url(#whiteGrad)" stroke-width="24" stroke-linecap="round"/>
  <path d="M296 272 L344 320 L392 272" 
        fill="none" stroke="url(#whiteGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>