<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#0A0A0C" stroke="#2DD4BF" stroke-width="4" stroke-opacity="0.35"/>

  <g transform="translate(256, 185) scale(0.72) translate(-256, -256)">
    <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
    <g fill="none">
      
    <!-- Pomodoro Circular Arc -->
    <path d="M200 120 A 145 145 0 1 1 312 120" fill="none" stroke="url(#symbolGrad)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="200" cy="120" r="14" fill="#FFFFFF"/>
    <circle cx="312" cy="120" r="14" fill="url(#symbolGrad)"/>
    
    <!-- Symmetrical Ambient Waves -->
    <path d="M165 210 Q 210 180 256 210 T 347 210" fill="none" stroke="url(#symbolGrad)" stroke-width="22" stroke-linecap="round"/>
    <path d="M140 256 Q 198 220 256 256 T 372 256" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    <path d="M165 302 Q 210 272 256 302 T 347 302" fill="none" stroke="url(#symbolGrad)" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Zen Center Ripple Node -->
    <circle cx="256" cy="256" r="10" fill="#2DD4BF"/>
        
    </g>
  </g>

  <text x="256" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CACalm</text>
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.2">Offline Ambient Mixer & Focus Engine</text>
</svg>