<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Squircle Light -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#F8FAFC" stroke="rgba(0, 0, 0, 0.08)" stroke-width="4"/>

  <!-- Ambient Glow Light -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Main Symbol Glyph Light -->
  <g fill="none">
    
    <path d="M130 310 A 145 145 0 1 1 382 310" fill="none" stroke="url(#symbolGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="14 10"/>
    <polygon points="270,140 170,270 245,270 230,372 342,240 268,240" fill="none" stroke="url(#symbolGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="266,165 192,260 250,260 238,340 318,246 264,246" fill="#9D174D" fill-opacity="0.25"/>
    <line x1="125" y1="330" x2="165" y2="330" stroke="#9D174D" stroke-width="16" stroke-linecap="round"/>
    <line x1="347" y1="330" x2="387" y2="330" stroke="#9D174D" stroke-width="16" stroke-linecap="round"/>
        
  </g>
</svg>