<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#0A0A0C" stroke="#F43F5E" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Main Symbol Glyph -->
  <g fill="none">
    
    <!-- Outer Sentinel Cluster Hexagon -->
    <!-- Points at R=155: (256,101), (390,178), (390,334), (256,411), (122,334), (122,178) -->
    <polygon points="256,101 390,178 390,334 256,411 122,334 122,178"
             stroke="url(#symbolGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- High-Impact Health Probe & Telemetry Heartbeat Wave -->
    <path d="M122 256 H185 L215 180 L256 332 L297 180 L327 256 H390"
          stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Active Watchdog Node Pings at Key Vertices -->
    <circle cx="256" cy="101" r="14" fill="#FFFFFF"/>
    <circle cx="256" cy="411" r="14" fill="#FFFFFF"/>
        
  </g>
</svg>